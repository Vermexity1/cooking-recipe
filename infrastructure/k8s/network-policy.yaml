apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: veil-worker-egress
spec:
  podSelector:
    matchLabels:
      app: veil-browser-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
        - protocol: UDP
          port: 53
