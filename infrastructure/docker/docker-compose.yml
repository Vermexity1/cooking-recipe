services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: veil
      POSTGRES_PASSWORD: veil
      POSTGRES_DB: veil
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: ../../apps/api
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://veil:veil@postgres:5432/veil
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ../../apps/worker
    environment:
      SESSION_ID: cx-compose
      WORKSPACE_ID: private
      SCRATCH_ROOT: /tmp/veil-sessions
      INITIAL_URL: https://example.com
    security_opt:
      - no-new-privileges:true
    shm_size: "1gb"
    pids_limit: 256
    mem_limit: 1024m
    cpus: 1
    depends_on:
      - redis

volumes:
  postgres-data:
  redis-data:
