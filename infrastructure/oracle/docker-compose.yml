services:
  worker:
    build:
      context: ../../apps/worker
      dockerfile: Dockerfile.oracle
    env_file:
      - worker.env
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - worker
    environment:
      ORACLE_WORKER_HOST: ${ORACLE_WORKER_HOST}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_config:
  caddy_data:
